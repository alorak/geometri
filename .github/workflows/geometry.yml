name: Geometri matematik testleri

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  geometry:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
